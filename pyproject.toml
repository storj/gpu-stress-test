[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gpu-stress-test"
version = "0.1.0"
description = "NVIDIA GPU stress harness for AI workloads"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2.0","numpy"
]

[tool.hatch.build.targets.wheel]
packages = ["gpu_stress_test"]

[tool.uv]
torch-backend = "cu128"
